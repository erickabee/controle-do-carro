name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Testes dos cálculos
        run: npm test
      - name: Testes das regras de segurança (emulador do Firestore)
        run: npm run test:regras
      - name: Instalar o navegador dos testes de tela
        run: npx playwright install --with-deps chromium
      - name: Testes de tela (navegador + emuladores)
        run: npm run test:telas

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Criar firebase-config.js a partir do segredo FIREBASE_CONFIG
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node scripts/gerar-config.mjs
      - name: Montar o site (só os arquivos do aplicativo)
        run: |
          mkdir _site
          cp -r index.html css js manifest.webmanifest sw.js icone.svg icone-192.png icone-512.png firebase-config.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
