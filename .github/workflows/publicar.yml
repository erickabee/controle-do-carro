name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  # Execução manual (Actions → Testar e publicar → Run workflow): atualização ou recuperação
  # extraordinária. Em outro branch, gera e confere os dados sem publicar nada.
  workflow_dispatch:
    inputs:
      simular_falha_da_fonte:
        description: 'Teste: fingir que a ANP/IBGE está fora do ar (deve manter os últimos dados válidos)'
        type: boolean
        default: false
  # Toda terça-feira, 9h17 (Brasília): a ANP publica a pesquisa da semana anterior na segunda-feira.
  # O GitHub só roda agendamentos do branch principal (main).
  schedule:
    - cron: '17 12 * * 2'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Testes dos cálculos
        run: npm test
      - name: Testes das regras de segurança (emulador do Firestore)
        run: npm run test:regras
      - name: Instalar o navegador dos testes de tela
        run: npx playwright install --with-deps chromium
      - name: Testes de tela (navegador + emuladores)
        run: npm run test:telas

  # Tela Postos: preços da ANP (planilha semanal oficial) + localização pelo CNEFE 2022 do IBGE.
  # Sem serviços pagos nem chaves. Gera arquivos estáticos, confere e decide:
  # dados novos válidos -> publica; senão -> mantém os últimos dados válidos do site;
  # sem nenhum dado válido -> falha e o site NÃO é publicado.
  dados-postos:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar os arquivos do IBGE e as coordenadas já calculadas
        uses: actions/cache/restore@v4
        with:
          path: .cnefe
          key: postos-cnefe-v1-restaurar
          restore-keys: postos-cnefe-v1-
      - name: Gerar os dados de postos (ANP + IBGE)
        id: gerar
        if: ${{ !inputs.simular_falha_da_fonte }}
        continue-on-error: true
        run: |
          pip install --quiet openpyxl==3.1.5
          rm -f .cnefe/revendas.xlsx
          inicio=$(date +%s)
          python3 scripts/postos/gerar_postos.py --saida novo-postos --cnefe .cnefe --cache .cnefe/coordenadas.json
          echo "Geração: $(( ($(date +%s) - inicio) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"
      - name: Conferir e escolher os dados (novos ou os últimos válidos)
        run: python3 scripts/postos/preparar_publicacao.py --novo novo-postos --saida postos-publicar --site https://controlecarro.web.app
      - name: Tamanho dos dados
        if: always()
        run: |
          {
            echo "### Tamanho"
            [ -d postos-publicar ] && echo "- Dados para o site: $(du -sh postos-publicar | cut -f1) em $(find postos-publicar -type f | wc -l) arquivos"
            [ -d .cnefe ] && echo "- Cache do IBGE no GitHub Actions: $(du -sh .cnefe | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dados-postos
          path: postos-publicar
          retention-days: 14
      # Só guarda uma cópia nova quando algo mudou (posto novo localizado): a chave depende do conteúdo.
      - name: Guardar o cache do IBGE para a próxima semana
        if: ${{ always() && steps.gerar.outcome == 'success' && hashFiles('.cnefe/coordenadas.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cnefe
          key: postos-cnefe-v1-${{ hashFiles('.cnefe/coordenadas.json', '.cnefe/centros/*.json') }}

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [testes, dados-postos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: firebase-hosting
      url: https://controlecarro.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir a credencial de publicação
        env:
          CREDENCIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CREDENCIAL" ]; then
            echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT. Veja docs/CONFIGURAR-FIREBASE.md, seção 'Publicar no Firebase Hosting'."
            exit 1
          fi
      - name: Criar firebase-config.js a partir do segredo FIREBASE_CONFIG
        id: config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node scripts/gerar-config.mjs
      - name: Montar o site (só os arquivos do aplicativo)
        run: |
          mkdir _site
          cp -r index.html css js img manifest.webmanifest sw.js favicon.ico favicon-32.png icone-180.png icone-192.png icone-512.png icone-maskable-512.png firebase-config.js _site/
      - name: Trazer os dados de postos conferidos
        uses: actions/download-artifact@v4
        with:
          name: dados-postos
          path: _site/postos
      - name: Não publicar sem dados de postos válidos
        run: test -s _site/postos/indice.json
      - name: Publicar no Firebase Hosting (controlecarro.web.app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.config.outputs.projectId }}
          channelId: live

  # O endereço antigo (GitHub Pages) passa a levar ao endereço novo.
  redirecionar-endereco-antigo:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ENDERECO_APP: https://controlecarro.web.app
    steps:
      - uses: actions/checkout@v4
      - name: Montar a página de redirecionamento
        run: |
          mkdir _redirecionar
          cp publicacao/redirecionar/* _redirecionar/
          curto="${ENDERECO_APP#https://}"
          sed -i "s#__ENDERECO_APP__#${ENDERECO_APP}#g; s#__ENDERECO_CURTO__#${curto}#g" _redirecionar/index.html _redirecionar/404.html
          ! grep -q "__ENDERECO" _redirecionar/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirecionar
      - id: deploy
        uses: actions/deploy-pages@v4
