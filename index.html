<!doctype html>
<html lang="pt-BR" data-tema="claro" data-texto="padrao">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f7">

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="css/estilo.css">
  <script>
    // Aplica o tema e o tamanho do texto guardados no aparelho antes de desenhar a tela.
    (function () {
      var a = {};
      try { a = JSON.parse(localStorage.getItem('controleCarro.aparencia')) || {}; } catch (e) { a = {}; }
      var h = document.documentElement;
      if (/^(claro|escuro|auto)$/.test(a.tema)) h.setAttribute('data-tema', a.tema);
      if (/^(padrao|maior|enorme)$/.test(a.texto)) h.setAttribute('data-texto', a.texto);
    })();
  </script>
</head>

  <div id="faixa-demo" class="faixa-demo" hidden></div>

  <div id="conexao" class="conexao" role="status" aria-live="polite" hidden></div>
